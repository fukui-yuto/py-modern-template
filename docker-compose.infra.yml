# =============================================================================
# テスト用 CI/CD インフラ (GitLab CE + GitLab Runner + Jenkins)
# =============================================================================
# 用途: テンプレートの CI パイプラインを検証するためのローカル環境
# 使い方: docker compose -f docker-compose.infra.yml up -d
# 詳細: docs/INFRA_SETUP.md
#
# 注意: これはテンプレートの検証用です。
#       copier で生成されるプロジェクトには含まれません。
# =============================================================================

services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    hostname: gitlab
    restart: unless-stopped
    ports:
      - "8929:80"
      - "2224:22"
      - "5050:5050"
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        gitlab_rails['initial_root_password'] = 'P@ssw0rd1234'
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
        registry_external_url 'http://gitlab:5050'
        registry['enable'] = true
        registry_nginx['listen_port'] = 5050
        registry_nginx['listen_https'] = false
        puma['workers'] = 0
        sidekiq['concurrency'] = 5
        prometheus_monitoring['enable'] = false
    shm_size: "256m"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/users/sign_in"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    networks:
      - ci-net

  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    container_name: gitlab-runner
    restart: unless-stopped
    volumes:
      - runner_config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      gitlab:
        condition: service_healthy
    networks:
      - ci-net

  jenkins:
    build:
      context: ./infra/jenkins
    container_name: jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JENKINS_HOME: /var/jenkins_home
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - ci-net

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  runner_config:
  jenkins_home:

networks:
  ci-net:
    driver: bridge
